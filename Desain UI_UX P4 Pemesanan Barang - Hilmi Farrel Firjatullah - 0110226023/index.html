<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4a90e2" />
    <title>Pemesanan Barang | Hilmi Farrel Firjatullah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- menu navigasi halaman -->
    <div class="top-widget" id="top" aria-label="Menu halaman">
        <a class="nav-link active" href="#top">Home</a>
        <a class="nav-link" href="#generate-link">Generate Link</a>
        <a class="nav-link" href="#transaction-history">Transaction History</a>
        <a class="nav-link" href="#policy">Policy</a>
        <a class="nav-link logout-link" href="../index.html">Logout</a>
    </div>

    <main class="page-content">

      <!-- form barang, datanya dikirim ke halaman hasil menggunakan GET -->
      <form
        class="order-form"
        action="success.html"
        method="get"
      >
        <!-- bagian foto dan informasi barang -->
        <section class="product-section" aria-label="Informasi barang">
          <div class="product-photo-column">
            <!-- area foto; gambar tidak dipratinjau tanpa JavaScript -->
            <div class="product-photo" id="photo-preview">
              <span class="photo-placeholder" aria-hidden="true">
                <svg viewBox="0 0 48 48" focusable="false">
                  <rect x="7" y="9" width="34" height="30" rx="3"></rect>
                  <circle cx="18" cy="19" r="3"></circle>
                  <path d="m9 34 10-10 7 7 5-5 8 8"></path>
                </svg>
                <span>Foto barang</span>
              </span>
            </div>
            <label class="upload-button" for="product-image">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 12v4h12v-4"></path>
              </svg>
              Upload picture
            </label>
            <!-- input foto hanya untuk memilih file dan tidak ikut dikirim dengan method GET -->
            <input
              class="visually-hidden"
              type="file"
              id="product-image"
              accept="image/png, image/jpeg"
            />
            <p class="upload-hint">Foto hanya pilihan; tidak ikut dikirim.</p>
          </div>

          <div class="form-fields">
            <!-- judul barang wajib diisi -->
            <div class="field-row">
              <label for="title"
                >Title Here <span class="required-mark">*</span></label
              >
              <input
                type="text"
                id="title"
                name="title"
                placeholder="ROG Zephyrus duo 16"
                minlength="2"
                maxlength="100"
                required
              />
            </div>
            <!-- deskripsi opsional dengan batas maksimal 500 karakter -->
            <div class="field-row description-row">
              <label for="description">Description</label>
              <textarea
                id="description"
                name="description"
                rows="3"
                maxlength="500"
                placeholder="Tahun 2023
                Model: ROG Zephyrus duo 16
                Kondisi: Bagus, mulus, tidak ada cacat
                Harga: Rp 50.000.000"
              ></textarea
              >
            </div>  
            <!-- informasi rekening untuk menerima pembayaran -->
            <div class="field-row">
              <label for="account-number"
                >Account Number <span class="required-mark">*</span></label
              >
              <input
                type="text"
                id="account-number"
                name="account-number"
                inputmode="numeric"
                pattern="[0-9]{8,16}"
                minlength="8"
                maxlength="16"
                title="Masukkan 8 sampai 16 digit angka tanpa spasi atau tanda hubung."
                placeholder="1234567890"
                required
              />
            </div>
            <div class="field-row">
              <label for="bank"
                >Bank <span class="required-mark">*</span></label
              >
              <select id="bank" name="bank" required>
                <option value="" disabled selected>Pilih bank</option>
                <option value="BCA">BCA</option>
                <option value="HSBC">HSBC</option>
                <option value="Mandiri">Mandiri</option>
                <option value="BNI">BNI</option>
                <option value="BRI">BRI</option>
              </select>
            </div>
            <div class="field-row">
              <label for="account-holder"
                >Account Holder <span class="required-mark">*</span></label
              >
              <input
                type="text"
                id="account-holder"
                name="account-holder"
                placeholder="Nama Pemilik Akun"
                minlength="2"
                maxlength="60"
                required
              />
            </div>
            <!-- jumlah transaksi dibatasi dari 1 sampai 3 -->
            <div class="field-row transaction-row">
              <label for="transaction-count">Transaction</label>
              <div class="transaction-control">
                <input
                  type="number"
                  id="transaction-count"
                  name="transaction-count"
                  min="1"
                  max="3"
                  step="1"
                  placeholder="1"
                  aria-describedby="transaction-help"
                />
                <span class="field-hint" id="transaction-help"
                  >Jika transaksi untuk 3 orang, pilih 3 penerima.</span
                >
              </div>
            </div>
            <!-- pilihan cara mengirim link dan data penerimanya -->
            <fieldset class="delivery-options">
              <legend class="visually-hidden">Cara mengirim link</legend>
              <label class="check-option">
                <input
                  type="checkbox"
                  id="send-mobile"
                  name="send-mobile"
                />
                <span class="custom-check" aria-hidden="true"></span>
                Send to Mobile Phone
              </label>
              <label class="check-option">
                <input
                  type="checkbox"
                  id="send-email"
                  name="send-email"
                />
                <span class="custom-check" aria-hidden="true"></span>
                Send to Email
              </label>
            </fieldset>
            <div class="field-row recipient-row" id="mobile-row">
              <label for="mobile-numbers">Send to Mobile Phone</label>
              <input
                type="tel"
                id="mobile-numbers"
                name="mobile-numbers"
                placeholder="081234567890"
                pattern="(\+62|0)8[1-9][0-9]{6,10}"
                title="Masukkan nomor HP Indonesia yang diawali 08 atau +62, tanpa spasi atau tanda hubung."
              />
            </div>
            <div class="field-row recipient-row" id="email-row">
              <label for="email-addresses">Send to Email</label>
              <input
                type="email"
                id="email-addresses"
                name="email-addresses"
                placeholder="nama@gmail.com"
                multiple
                maxlength="254"
              />
            </div>
          </div>
        </section>

        <!-- tombol untuk mengirim form ke halaman hasil -->
        <div class="form-footer" id="generate-link">
          <p class="form-note">
            <span class="required-mark">*</span> Wajib diisi yaaaa....
          </p>
          <button class="primary-button" type="submit">
            Generate Link nya disini coi
            <span class="visually-hidden">Generate Link</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 10h12m-5-5 5 5-5 5"></path>
            </svg>
          </button>
        </div>
      </form>
    </main>

  </body>
</html>
